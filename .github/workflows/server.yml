name: Server

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'game/**'
      - 'net/**'
      - 'engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.dockerignore'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version' server/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gridlock-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gridlock-server:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/gridlock-server:latest
            docker stop gridlock-server || true
            docker rm gridlock-server || true
            docker run -d \
              --name gridlock-server \
              --restart unless-stopped \
              -p 7777:7777/udp \
              ${{ secrets.DOCKERHUB_USERNAME }}/gridlock-server:latest
